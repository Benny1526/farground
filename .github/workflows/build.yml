name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: farground-${{ matrix.mc }}
          path: build/libs/farground-*+${{ matrix.mc }}.jar
