name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.loader }} ${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
        loader: [fabric, neoforge]
        include:
          - loader: fabric
            project: ""
            jars: build/libs/farground-*+
          - loader: neoforge
            project: "-p neoforge"
            jars: neoforge/build/libs/farground-neoforge-*+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew ${{ matrix.project }} build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: farground-${{ matrix.loader }}-${{ matrix.mc }}
          path: ${{ matrix.jars }}${{ matrix.mc }}.jar
